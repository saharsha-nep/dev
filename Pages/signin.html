<!DOCTYPE HTML>
<html>
	<head>
		<title>UrbanSprout - SignIn</title>
		<meta name="author" content="Group 2">
		<meta name="description" content="Sign in page for UrbanSprout">
		<meta name="keywords" content="Urban gardening, seed kits, home gardening, planting, plants">
		<link rel="stylesheet" href="../CSS/style.css"> <!-- External CSS -->
		<style>
		    /* Centers the sign-in box on the page */
		    .signin-container {
		        display: flex;
		        justify-content: center;
		        align-items: center;
		        min-height: 80vh;
		    }

		    /* Sign-in card */
		    .signin-box {
		        background: #fff;
		        padding: 30px 40px;
		        border-radius: 10px;
		        box-shadow: 0 0 15px rgba(0,0,0,0.1);
		        width: 300px;
		        text-align: center;
		    }

		    .signin-box h1 {
		        color: #2E7D32;
		        margin-bottom: 20px;
		    }

		    .signin-box input {
		        width: 100%;
		        padding: 10px;
		        margin: 10px 0;
		        border-radius: 5px;
		        border: 1px solid #ccc;
		        box-sizing: border-box;
		    }

		    .signin-box button {
		        width: 100%;
		        padding: 12px;
		        background: #2E7D32;
		        color: white;
		        border: none;
		        border-radius: 5px;
		        cursor: pointer;
		        font-size: 16px;
		    }

		    .signin-box button:hover {
		        background: #276629;
		    }
		</style>
	</head>
	<body>
		<!-- Navigation bar -->
        <header>
            <nav>
                <ul>
                    <li><a href="../index.html">UrbanSprout</a></li>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="research.html">Research</a></li>
                    <li><a href="aboutus.html">About</a></li>
                    <li><a href="signin.html">Login</a></li>
                </ul>
            </nav>
        </header>
        <!--Page Content-->
        <div class="signin-container">
		    <div class="signin-box">
		        <h1>Sign In</h1>
		        <form onsubmit="return validateForm()">
		        	Email: <br>
		            <input type="text" id="email" placeholder="Enter Your Email">
		            Password: <br>
					<input type="password" id="password" placeholder="Enter Your Password">
		            <button type="submit">Sign In</button>
		        </form>
		    </div>
		</div>
		<!-- Footer Section -->
        <footer>
            <div class="footer-container">

                <div class="footer-left">
                    <h2>UrbanSprout</h2>
                    <p>For all your gardening needs</p>
                </div>

                <div class="footer-right">
                    <p>Contact: info@urbansprout.com</p>
                    <p>© 2026 UrbanSprout</p>
                </div>

            </div>
        </footer>
        <!-- Page Script-->
        <script src="../JS/script.js"></script>
    </body> 
</html>
