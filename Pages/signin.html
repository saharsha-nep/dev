<!DOCTYPE HTML>
<html>
	<head>
		<title>UrbanSprout - SignIn</title>
		<meta name="author" content="Group 2">
		<meta name="description" content="Product page for UrbanSprout">
		<meta name="keywords" content="Urban gardening, seed kits, home gardening, planting, plants">

		<link rel="stylesheet" href="../CSS/style.css"> <!-- External CSS for global site styles -->

		<!-- Internal CSS -->
		<style>
			.signin-container {
			    display: flex;/*Enable flexbox*/
			    justify-content: center;/*Center horizontally*/
			    align-items: center;/*Center vertically*/
			    min-height: 80vh;/*Fill most of viewport height*/
			}

			.signin-box {
		        background: #fff;/*White background*/
		        padding: 30px 40px;/*Space inside the box*/
		        border-radius: 10px;/*Rounded corners*/
		        box-shadow: 0 0 15px rgba(0,0,0,0.1); /*Shadow*/
		        width: 300px;/*Fixed width*/
		        text-align: center;/*Center all text inside*/
		    }

		    /* Sign-in heading styles */
		    .signin-box h1 {
		        color: #2E7D32;/*Green theme color*/
		        margin-bottom: 20px;/*Space below heading*/
		    }

		    .signin-box input {
		        width: 100%;/*Full width of the box*/
		        padding: 10px;/*Internal spacing*/
		        margin: 10px 0;/*Vertical spacing between inputs*/
		        border-radius: 5px;/*Rounded corners for inputs*/
		        border: 1px solid #ccc;/*Light grey border*/
		        box-sizing: border-box;/*Include padding in width*/
		    }

		    .signin-box button {
		        width: 100%;/*Full width button*/
		        padding: 12px;/*Internal padding*/
		        background: #2E7D32;/*Green theme background*/
		        color: white;/*Text color*/
		        border: none;/*Remove default border*/
		        border-radius: 5px;/*Rounded corners*/
		        cursor: pointer;/*Pointer on hover*/
		        font-size: 16px;/*Text size */
		    }
		    .signin-box button:hover {
		        background: #276629; /*Dark green on hover*/
		    }
		</style>
	</head>
	<body>
		<!-- Navigation bar -->
        <header>
            <nav>
                <ul>
                    <li><a href="../index.html">UrbanSprout</a></li>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="research.html">Research</a></li>
                    <li><a href="aboutus.html">About</a></li>
                    <li><a href="signin.html">Login</a></li>
                </ul>
            </nav>
        </header>
        <!--Page Content-->
        <div class="signin-container">
		    <div class="signin-box">
		        <h1>Sign In</h1>
		        <form onsubmit="return validateForm()">
		            <input type="text" id="email" placeholder="Enter Your Email">
					<input type="password" id="password" placeholder="Enter Your Password">
		            <button type="submit">Sign In</button>
		        </form>
		    </div>
		</div>
		<!-- Footer Section -->
        <footer>
            <div class="footer-container">

                <div class="footer-left">
                    <h2>UrbanSprout</h2>
                    <p>For all your gardening needs</p>
                </div>

                <div class="footer-right">
                    <p>Contact: info@urbansprout.com</p>
                    <p>© 2026 UrbanSprout</p>
                </div>

            </div>
        </footer>
        <!-- Page Script-->
        <script src="../JS/script.js"></script>
    </body> 
</html>
